name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: Validate tag and source
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v1.2.0." >&2
            exit 1
          fi
          grep -F "* Version:           $version" tt5-caldav-calendar.php
          grep -F "define( 'TT5_CALDAV_VERSION', '$version' );" tt5-caldav-calendar.php
          grep -F "Stable tag: $version" readme.txt

      - name: Lint and test
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/editor.test.cjs

      - name: Build installable plugin ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_dir="dist/tt5-caldav-calendar"
          archive="tt5-caldav-calendar-${version}.zip"
          mkdir -p "$package_dir"
          cp -R LICENSE README.md readme.txt tt5-caldav-calendar.php uninstall.php assets blocks includes "$package_dir/"
          (
            cd dist
            zip -qr "../$archive" tt5-caldav-calendar
          )
          sha256sum "$archive" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "${ARCHIVE}.sha256" --verify-tag --generate-notes --title "TT5 CalDAV Kalender ${GITHUB_REF_NAME#v}"
